<!DOCTYPE html>
<html lang="ru">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Карта Хейвена</title>
	<link rel="shortcut icon" type="image/png" href="images/favicon.png"/>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css"/>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
	<script src="supabase-config.js"></script>
	<script src="regions_factions.js"></script>
	<script src="regions_provinces.js"></script>
</head>
<body>

<!-- Контур стрелки «Перейти к заданию» (пути из макета) — один раз, копии через <use>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<symbol id="arrow" viewBox="0 0 14 6"><path d="M2.72827 3.99374C3.28049 3.99374 3.72815 3.5515 3.72815 3.00598C3.72815 2.46045 3.28049 2.01821 2.72827 2.01821C2.17606 2.01821 1.7284 2.46045 1.7284 3.00598C1.7284 3.5515 2.17606 3.99374 2.72827 3.99374Z"/><path d="M14.0005 3.0072L10.7319 6.00916L10.2241 5.47107L12.3882 3.48474H7.31201V2.54041H12.3999L10.2241 0.542358L10.7319 0.00427246L14.0005 3.0072Z"/></symbol>
</svg>

<div id="map"></div>

<aside class="sidebar" id="sidebar">
	<button type="button" class="sys-btn sys-btn--collapse sidebar__collapse" id="collapse" title="Свернуть сайдбар"><img src="images/ui/sys/collapse.svg" alt=""></button>

	<header class="sidebar__head">
		<h1 class="h1 sidebar__title">Хейвен</h1>
		<p class="sidebar__year">5417 год</p>
	</header>

	<div class="sidebar__body" id="sections">
		<section class="sb-section" data-section="locations">
			<div class="sb-section__head" data-action="section"><div class="section-label"><span class="chevron"></span><span>Локации</span></div><span class="sb-section__count" data-count></span></div>
			<div class="sb-section__body"><div class="sb-section__inner"><div class="sb-section__content" data-content></div></div></div>
		</section>
		<section class="sb-section" data-section="layers">
			<div class="sb-section__head" data-action="section"><div class="section-label"><span class="chevron"></span><span>Слои карты</span></div><span class="sb-section__count" data-count></span></div>
			<div class="sb-section__body"><div class="sb-section__inner"><div class="sb-section__content" data-content></div></div></div>
		</section>
		<section class="sb-section is-open" data-section="journal">
			<div class="sb-section__head" data-action="section"><div class="section-label is-open"><span class="chevron"></span><span>Журнал заданий</span></div><span class="sb-section__count" data-count></span></div>
			<div class="sb-section__body"><div class="sb-section__inner"><div class="sb-section__content" data-content></div></div></div>
		</section>
		<section class="sb-section" data-section="provinces">
			<div class="sb-section__head" data-action="section"><div class="section-label"><span class="chevron"></span><span>Провинции</span></div><span class="sb-section__count" data-count></span></div>
			<div class="sb-section__body"><div class="sb-section__inner"><div class="sb-section__content" data-content></div></div></div>
		</section>
		<section class="sb-section" data-section="factions">
			<div class="sb-section__head" data-action="section"><div class="section-label"><span class="chevron"></span><span>Слава</span></div><span class="sb-section__count" data-count></span></div>
			<div class="sb-section__body"><div class="sb-section__inner"><div class="sb-section__content" data-content></div></div></div>
		</section>
		<div class="sidebar__spacer"></div>
	</div>

	<!-- Режим правки (админ): форма вместо разделов и поиска; поля строит script.js. -->
	<div class="edit" id="edit">
		<form class="edit__body" id="edit-form" novalidate autocomplete="off"></form>
		<div class="edit__foot">
			<button type="button" class="btn btn--action" data-action="edit-back"><span class="btn__label">Назад</span></button>
			<span class="edit__spacer"></span>
			<button type="button" class="btn btn--icon btn--action btn--danger" id="edit-delete" data-action="edit-delete" data-confirm="Точно удалить?" hidden><span class="btn__icon"></span><span class="btn__label">Удалить</span></button>
			<button type="submit" form="edit-form" class="btn btn--primary"><span class="btn__label">Сохранить</span></button>
		</div>
	</div>

	<div class="sidebar__scrim" id="scrim"></div>

	<div class="sidebar__search" id="search">
		<div class="search-filters"><div class="search-filters__inner" id="search-filters"></div></div>
		<label class="search-row">
			<span class="search-row__icon"><img src="images/ui/search.svg" alt=""></span>
			<input type="text" class="search-row__input" id="search-input" placeholder="Провинция, место или задание" autocomplete="off">
			<button type="button" class="search-row__clear" id="search-clear" title="Очистить поиск" aria-label="Очистить поиск">
				<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M0.7 0L4 3.3L7.3 0L8 0.7L4.7 4L8 7.3L7.3 8L4 4.7L0.7 8L0 7.3L3.3 4L0 0.7L0.7 0Z"/></svg>
			</button>
		</label>
	</div>
</aside>

<div class="map-nav map-controls" id="map-nav"></div>
<button type="button" class="sys-btn sys-btn--login map-login" id="login" title="Войти"><img src="images/ui/sys/login.svg" alt=""></button>

<!-- Вход для админа — под ромбом входа. -->
<form class="login" id="login-form" hidden autocomplete="on">
	<p class="login__title">Вход для администратора</p>
	<input type="email" class="input" name="email" placeholder="Почта" autocomplete="username" required>
	<input type="password" class="input" name="password" placeholder="Пароль" autocomplete="current-password" required>
	<p class="form__error" id="login-error"></p>
	<button type="submit" class="btn btn--primary login__submit"><span class="btn__label">Войти</span></button>
</form>

<script src="script.js"></script>
</body>
</html>
