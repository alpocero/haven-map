<html lang-"ru">
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Карта Хейвена</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
	<link rel="stylesheet" href="https://unpkg.com/leaflet-search@4.0.0/dist/leaflet-search.src.css"/>
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 1920px;
			width: 1080px;
			max-width: 100%;
			max-height: 100%;
			background-color: #202020;
		}
		.leaflet-control-attribution,
		.leaflet-popup-tip {
			display: none;
		}
		.leaflet-popup-content-wrapper,
		.leaflet-popup-tip {
			background: #0f0f0fbd;
			background-color: #0f0f0fbd;
			border-radius: 0px;
			backdrop-filter: blur(8px);
		}
		.leaflet-popup-content {
			color: #dcd0c0;
		    margin: 8px 20px 8px 12px;
		}
		h1, h2, h3 {
	    	margin: 0;
    		line-height: 1.3;
    		min-height: 1px;
    		font-weight: 400;
		}
		h1 {
			font-family: 'El Messiri';
			font-weight: 600;
			font-size: 1.3em;
		}
		h2 {
			margin-top: 1px;
			font-size: .89em;
			color:#8d877f;
			font-family: 'Arimo';
			font-style: italic;
		}
		h3 {
			margin-top: -5px;
    		margin-bottom: 4px;
			font-size: .95em;
			color:#b8b2aa;
			font-family: 'Arimo';
		}
		.leaflet-control-search .search-tooltip {
	    max-height: 625px;
		}
	</style>

	

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="marker_locations.js"></script>
	<script src="https://unpkg.com/leaflet-search@4.0.0/dist/leaflet-search.src.js"></script>
</head>




<body>

<div id="map" style="width: 100%; height: 100%;"></div>

<script>

var map = L.map('map', {crs: L.CRS.Simple, minZoom: -5});

var bounds = [[0,0], [4480,5760]];
var image = L.imageOverlay('https://i.ibb.co/bRHm10kn/haven-map-full.jpg', bounds).addTo(map);

map.fitBounds(bounds);

//OVERLAY LAYERS
var politicalMap = L.imageOverlay('images/haven_map_political.png', bounds);
var provincies = L.imageOverlay('images/haven_map_provincies.png', bounds);

//
var settlements = L.layerGroup();

map.addLayer(provincies);
map.addLayer(settlements);


var baseLayers = {"Карта": map};
var overlayMaps = {'Политическая карта': politicalMap, 'Провинции': provincies, 'Поселения': settlements};
var layerControl = L.control.layers(baseLayers, overlayMaps).addTo(map);

//SETTLEMENTS
const JSONsettlements = L.geoJSON(markerLocations, {
	pointToLayer: function (feature, latlng) {
		var settlementMarker = L.icon({
    		iconUrl: 'images/settlement.png',
    		iconSize: [24, 24],
    		iconAnchor: [12, 12],
    		popupAnchor: [0, 0],
		});
		return L.marker(latlng, {icon: settlementMarker});
		
	},
	onEachFeature: function (feature, layer) {
		layer.bindPopup('<h1>'+feature.properties.name+'</h1><h2>'+feature.properties.amenity+'</h2>');
  }
}).addTo(map).addTo(settlements);


const searchControl = new L.Control.Search({
	layer: JSONsettlements,
	propertyName: 'name',
	textPlaceholder: 'Поиск',
	hideMarkerOnCollapse: true,
	initial: false
});

map.addControl(searchControl);




</script>

</body>
</html>
